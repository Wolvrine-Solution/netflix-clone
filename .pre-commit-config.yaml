repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bunx prettier --write
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css, scss, markdown, yaml]

      - id: eslint
        name: eslint
        entry: bunx eslint --fix
        language: system
        types_or: [javascript, jsx, ts, tsx]

  - repo: local
    hooks:
      - id: local-ci
        name: local-ci pre-push gate (mirrors GitHub Actions CI, runs locally)
        entry: bun run ci
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
