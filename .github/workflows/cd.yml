name: CD

# Deploys are manual only (hub rules: ci-internal-deploys, ci-local-cd-remote).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build api web admin
      - name: Smoke test
        run: |
          docker compose up -d postgres redis
          docker compose up -d api
          for i in $(seq 1 30); do curl -fsS http://localhost:4000/health && exit 0; sleep 2; done
          docker compose logs api
          exit 1
